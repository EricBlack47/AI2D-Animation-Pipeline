[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2d-animation-pipeline"
version = "0.1.0"
description = "AI-generated 2D animation pipeline toolkit for Unity"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = [
  "Pillow>=10.0.0",
  "jsonschema>=4.18.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ai2d = "ai2d_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai2d_pipeline*"]

[tool.setuptools.package-data]
ai2d_pipeline = ["schemas/*.json", "docs/*.md"]
